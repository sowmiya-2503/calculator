<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Simple Calculator</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                background-color: #f4f4f9;
                margin: 0;
                font-family: Arial, sans-serif;
            }
            
            .calculator {
                background-color: #333;
                padding: 20px;
                border-radius: 10px;
                box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
                width: 300px;
            }

            #display  {
                width: 100%;
                height: 50px;
                background-color: #fff;
                font-size: 24px;
                text-align: right;
                padding: 5px 10px;
                border: none;
                border-radius: 5px;
                margin-bottom: 15px;
                box-sizing: border-box;rd
            }

            .buttons {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
            }

            button {
                padding: 20px;
                font-size: 18px
                border: none;
                border-radius: 5px;
                background-color: #e0e0e0;  
            }
            
        </style>

    </head>
    <body>
        <div class="calculator">
            <input type="text" id="display" >
            <div class="buttons">

                <button class="clear" onclick="display.value=''">C</button>
                <button onclick="display.value+='/'" class="operator">/</button>
                <button onclick="display.value+='*'" class="operator">*</button>
                <button onclick="display.value=display.value.slice(0,-1)" class="operator">⌫</button>


                <button onclick="display.value+='7'">7</button>
                <button onclick="display.value+='8'">8</button>
                <button onclick="display.value+='9'">9</button>
                <button onclick="display.value+='-'" class="operator">-</button>


                <button onclick="display.value+='4'">4</button>
                <button onclick="display.value+='5'">5</button>
                <button onclick="display.value+='6'">6</button>
                <button onclick="display.value+='+'" class="operator">+</button>


                <button onclick="display.value+='1'">1</button>
                <button onclick="display.value+='2'">2</button>
                <button onclick="display.value+='3'">3</button>
                
                
                <button onclick="display.value=eval(display.value)"class="operator" style="grid-row:span 2">=</button>
                <button onclick="display.value+='0'">0</button>
                <button onclick="display.value+='.'" style="grid-column:span 2">.</button>
            
            </div>
        </div>
    
    
    </body>


</html>
